<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face{font-family:'Space Grotesk';src:url('/css/fonts/space-grotesk-500-latin.woff2') format('woff2');font-weight:500}
      @font-face{font-family:'Space Grotesk';src:url('/css/fonts/space-grotesk-600-latin.woff2') format('woff2');font-weight:600}
      @font-face{font-family:Inter;src:url('/css/fonts/inter-400-latin.woff2') format('woff2');font-weight:400}
      .display{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;letter-spacing:-.06em}
      .body{font-family:Inter,system-ui,sans-serif;font-weight:400}
    </style>
    <linearGradient id="headline" x1="88" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".15" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Wordmark -->
  <g transform="translate(88, 72)">
    <rect x="2" y="2" width="52" height="52" rx="11" stroke="#6366f1" stroke-width="4"/>
    <rect x="11" y="11" width="15" height="15" rx="4" fill="#6366f1"/>
    <rect x="30" y="11" width="15" height="15" rx="4" fill="#6366f1" opacity=".65"/>
    <rect x="11" y="30" width="15" height="15" rx="4" fill="#6366f1" opacity=".65"/>
    <rect x="30" y="30" width="15" height="15" rx="4" fill="#6366f1" opacity=".3"/>
  </g>
  <text x="160" y="116" class="display" font-size="44" font-weight="600" letter-spacing="-.04em" fill="#f1f5f9">roomkit.</text>

  <!-- Headline, as on the homepage -->
  <text x="88" y="300" class="display" font-size="112" fill="#f1f5f9">Build agents for</text>
  <text x="88" y="416" class="display" font-size="112" fill="url(#headline)">real conversations.</text>

  <!-- Promise and address -->
  <text x="88" y="490" class="body" font-size="30" fill="#94a3b8">Voice, messaging and AI agents, in one framework.</text>
  <text x="88" y="556" class="body" font-size="24" fill="#94a3b8">www.roomkit.live</text>
</svg>
